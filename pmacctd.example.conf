# Experimental pmacct backend; use pmacctd -i tun2socks -f pmacctd.conf
# IMPORTANT: interface selection is CLI -i; 'interface:' is ignored on Debian 12 pmacct 1.7.7.
daemonize: false
plugins: print
aggregate: src_host,dst_host,src_port,dst_port,proto
print_output: json
print_output_file: /var/lib/ntop-tools/pmacct/pmacct-%Y%m%d-%H%M%S.json
print_refresh_time: 60
promisc: false
